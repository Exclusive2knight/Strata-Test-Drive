<!doctype html><canvas id="gl" width="64" height="64"></canvas><pre id="status"></pre><script src="../core.js"></script><script src="../gpu.js"></script><script src="../flip.js"></script><script src="../renderer.js"></script><script src="../runtime.js"></script><script>
try{let gl=document.getElementById('gl').getContext('webgl');let d=new StrataFluidGPU.GPU(gl);let r=new StrataFluidRenderer(gl,d);window.result={pass:true,float:d.metrics.available,blend:!!d.floatBlend,timer:!!d.timer,renderer:gl.getParameter(gl.RENDERER),programs:Object.keys(d.programs)};if(d.metrics.available)d.guard(()=>{const v=new StrataFluidGPU.Volume(d,8,.5),w=new StrataFluidCore.World();v.survey(w);v.step(1/120,new StrataFluidCore.Environment(),{pos:[0,.3,0],temp:200,rate:3},2);window.result.error=gl.getError()});}catch(e){window.result={pass:false,error:e.stack}}document.getElementById('status').textContent=JSON.stringify(window.result);
</script>
